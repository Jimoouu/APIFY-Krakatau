<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komentar TikTok: Abu Krakatau Jadi Saldo DANA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            color: #f8fafc;
            overflow-x: hidden;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f97316;
        }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .glass-card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card-hover:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(249, 115, 22, 0.3); /* Orange glow border */
            box-shadow: 0 10px 40px -10px rgba(249, 115, 22, 0.15);
            transform: translateY(-2px);
        }

        /* Line clamp for long text */
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col items-center">

    <div class="fixed inset-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-orange-600/20 rounded-full blur-[100px] mix-blend-screen animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-blue-600/20 rounded-full blur-[100px] mix-blend-screen animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[30rem] h-[30rem] bg-amber-600/10 rounded-full blur-[120px] mix-blend-screen animate-blob animation-delay-4000"></div>
    </div>

    <header class="w-full max-w-2xl px-6 pt-16 pb-8 text-center relative z-10">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 mb-6 rounded-full glass-panel text-orange-400 text-xs font-bold tracking-wide uppercase shadow-[0_0_15px_rgba(249,115,22,0.2)]">
            <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
            FYP Trending
        </div>
        <h1 class="text-4xl sm:text-5xl font-extrabold mb-4 tracking-tight leading-tight">
            Abu Krakatau Jadi <br>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-blue-300 to-cyan-300">Saldo DANA?</span> 💸
        </h1>
        <p class="text-slate-400 text-sm sm:text-base font-medium max-w-lg mx-auto leading-relaxed">
            Kumpulan reaksi kocak netizen tentang tren halu ngubah debu vulkanik jadi cuan. 
        </p>
    </header>

    <main class="w-full max-w-2xl px-4 pb-24 flex-1 flex flex-col gap-4 relative z-10" id="app-container">
        
        <div id="loading-state" class="flex flex-col gap-4 w-full">
            <!-- Skeleton 1 -->
            <div class="glass-panel rounded-2xl p-5 flex gap-4 animate-pulse">
                <div class="w-12 h-12 rounded-full bg-slate-800/80 shrink-0"></div>
                <div class="flex-1 space-y-3 py-1">
                    <div class="h-4 bg-slate-800/80 rounded w-1/4"></div>
                    <div class="space-y-2">
                        <div class="h-3 bg-slate-800/80 rounded w-full"></div>
                        <div class="h-3 bg-slate-800/80 rounded w-5/6"></div>
                    </div>
                </div>
            </div>
            <!-- Skeleton 2 -->
            <div class="glass-panel rounded-2xl p-5 flex gap-4 animate-pulse opacity-70">
                <div class="w-12 h-12 rounded-full bg-slate-800/80 shrink-0"></div>
                <div class="flex-1 space-y-3 py-1">
                    <div class="h-4 bg-slate-800/80 rounded w-1/3"></div>
                    <div class="space-y-2">
                        <div class="h-3 bg-slate-800/80 rounded w-4/5"></div>
                    </div>
                </div>
            </div>
            <!-- Skeleton 3 -->
            <div class="glass-panel rounded-2xl p-5 flex gap-4 animate-pulse opacity-40">
                <div class="w-12 h-12 rounded-full bg-slate-800/80 shrink-0"></div>
                <div class="flex-1 space-y-3 py-1">
                    <div class="h-4 bg-slate-800/80 rounded w-1/4"></div>
                    <div class="space-y-2">
                        <div class="h-3 bg-slate-800/80 rounded w-full"></div>
                        <div class="h-3 bg-slate-800/80 rounded w-2/3"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="error-state" class="hidden flex-col items-center justify-center py-16 px-6 glass-panel rounded-3xl text-center border-red-500/20">
            <div class="w-16 h-16 mb-4 bg-red-500/10 rounded-full flex items-center justify-center text-red-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h3 class="text-xl font-bold text-slate-200 mb-2">Waduh, Gagal Muat Data</h3>
            <p class="text-slate-400 text-sm" id="error-message">Mungkin token API kadaluarsa atau URL-nya salah.</p>
        </div>

        <div id="comments-list" class="hidden flex-col gap-4">
            <!-- Rendered by JS -->
        </div>

    </main>

    <script>
        const API_URL = 'https://api.apify.com/v2/datasets/sqOEpw7rbsHD3h0av/items?token=apify_api_qFSsdWA35qSBc06XPJ0Jc91Bty7Reg2YVFJj';

        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const errorMessage = document.getElementById('error-message');
        const commentsList = document.getElementById('comments-list');

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }

        async function fetchApifyData() {
            try {
                // Simulate slight network delay to show off the cool skeleton loader (Remove in prod)
                await new Promise(resolve => setTimeout(resolve, 800));

                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP Error! Status: ${response.status}`);
                }

                const data = await response.json();
                
                if (!data || data.length === 0) {
                    throw new Error('Dataset kosong. Belum ada komentar yang berhasil di-scrape.');
                }

                renderComments(data);
                
            } catch (error) {
                console.error("Gagal:", error);
                showError(error.message);
            }
        }

        function renderComments(commentsArray) {
            loadingState.style.display = 'none';
            commentsList.classList.remove('hidden');

            let htmlContent = '';

            commentsArray.forEach((comment, index) => {
                // Defensive extraction
                const commentText = comment.text || comment.comment || "Sticker/Kosong";
                
                let username = "Netizen";
                let tag = "@netizen"
                if (comment.user && comment.user.nickname) {
                    username = comment.user.nickname;
                    tag = "@" + (comment.user.uniqueId || username.toLowerCase().replace(/\s/g, ''));
                } else if (comment.uniqueId) {
                    username = comment.uniqueId;
                    tag = "@" + comment.uniqueId;
                }
                
                let avatarUrl = `https://ui-avatars.com/api/?name=${username}&background=random&color=fff&size=128`;
                if (comment.user && comment.user.avatarThumb) avatarUrl = comment.user.avatarThumb;
                else if (comment.authorMeta && comment.authorMeta.avatar) avatarUrl = comment.authorMeta.avatar;

                const likes = comment.diggCount || comment.likes || Math.floor(Math.random() * 500); // Randomize if none for visual purpose
                const formattedLikes = formatNumber(likes);

                // Delay animation mapping
                const animDelay = (index * 0.1).toFixed(1);

                htmlContent += `
                    <div class="glass-panel glass-card-hover rounded-[1.25rem] p-4 sm:p-5 flex gap-3 sm:gap-4 opacity-0 animate-fade-in-up relative overflow-hidden group" style="animation-delay: ${animDelay}s">
                        
                        <!-- Glow highlight on left edge -->
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-orange-500 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

                        <!-- Avatar -->
                        <div class="relative shrink-0">
                            <img src="${avatarUrl}" alt="${username}" onerror="this.src='https://ui-avatars.com/api/?name=User&background=334155&color=fff'" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full object-cover border border-white/10 ring-2 ring-transparent group-hover:ring-orange-500/30 transition-all">
                        </div>
                        
                        <!-- Content -->
                        <div class="flex-1 min-w-0 flex flex-col justify-center pt-0.5">
                            <div class="flex items-center gap-2 mb-1">
                                <h4 class="font-bold text-slate-100 text-[15px] truncate leading-none">${username}</h4>
                                <span class="text-slate-500 text-xs truncate leading-none">${tag}</span>
                            </div>
                            
                            <p class="text-slate-300 text-[15px] leading-relaxed mb-3 pr-2">
                                ${commentText}
                            </p>

                            <!-- Fake Action Buttons -->
                            <div class="flex items-center gap-5 text-slate-400 mt-auto">
                                <button class="flex items-center gap-1.5 hover:text-red-500 transition-colors group/btn">
                                    <div class="p-1.5 rounded-full group-hover/btn:bg-red-500/10 transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                        </svg>
                                    </div>
                                    <span class="text-xs font-semibold">${formattedLikes}</span>
                                </button>
                                
                                <button class="flex items-center gap-1.5 hover:text-blue-400 transition-colors group/btn">
                                    <div class="p-1.5 rounded-full group-hover/btn:bg-blue-400/10 transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                                        </svg>
                                    </div>
                                    <span class="text-xs font-semibold">Balas</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            commentsList.innerHTML = htmlContent;
        }

        function showError(msg) {
            loadingState.style.display = 'none';
            errorState.classList.remove('hidden');
            errorState.classList.add('flex');
            errorMessage.textContent = msg;
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchApifyData();
        });
    </script>
</body>
</html>
