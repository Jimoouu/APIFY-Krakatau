<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komentar TikTok: Abu Krakatau Jadi Saldo DANA</title>
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Link ke file CSS terpisah -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen relative flex flex-col items-center">

    <!-- Animasi Background -->
    <div class="fixed inset-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-orange-600/20 rounded-full blur-[100px] mix-blend-screen animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-blue-600/20 rounded-full blur-[100px] mix-blend-screen animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[30rem] h-[30rem] bg-amber-600/10 rounded-full blur-[120px] mix-blend-screen animate-blob animation-delay-4000"></div>
    </div>

    <header class="w-full max-w-2xl px-6 pt-16 pb-8 text-center relative z-10">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 mb-6 rounded-full glass-panel text-orange-400 text-xs font-bold tracking-wide uppercase shadow-[0_0_15px_rgba(249,115,22,0.2)]">
            <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
            FYP Trending
        </div>
        <h1 class="text-4xl sm:text-5xl font-extrabold mb-4 tracking-tight leading-tight">
            Abu Krakatau Jadi <br>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-blue-300 to-cyan-300">Saldo DANA?</span> 💸
        </h1>
        <p class="text-slate-400 text-sm sm:text-base font-medium max-w-lg mx-auto leading-relaxed">
            Kumpulan reaksi kocak netizen tentang tren halu ngubah debu vulkanik jadi cuan. 
        </p>
    </header>

    <main class="w-full max-w-2xl px-4 pb-24 flex-1 flex flex-col gap-4 relative z-10" id="app-container">
        
        <!-- Skeleton Loading -->
        <div id="loading-state" class="flex flex-col gap-4 w-full">
            <div class="glass-panel rounded-2xl p-5 flex gap-4 animate-pulse">
                <div class="w-12 h-12 rounded-full bg-slate-800/80 shrink-0"></div>
                <div class="flex-1 space-y-3 py-1">
                    <div class="h-4 bg-slate-800/80 rounded w-1/4"></div>
                    <div class="space-y-2">
                        <div class="h-3 bg-slate-800/80 rounded w-full"></div>
                        <div class="h-3 bg-slate-800/80 rounded w-5/6"></div>
                    </div>
                </div>
            </div>
            <div class="glass-panel rounded-2xl p-5 flex gap-4 animate-pulse opacity-70">
                <div class="w-12 h-12 rounded-full bg-slate-800/80 shrink-0"></div>
                <div class="flex-1 space-y-3 py-1">
                    <div class="h-4 bg-slate-800/80 rounded w-1/3"></div>
                    <div class="space-y-2">
                        <div class="h-3 bg-slate-800/80 rounded w-4/5"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden flex-col items-center justify-center py-16 px-6 glass-panel rounded-3xl text-center border-red-500/20">
            <div class="w-16 h-16 mb-4 bg-red-500/10 rounded-full flex items-center justify-center text-red-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h3 class="text-xl font-bold text-slate-200 mb-2">Waduh, Gagal Muat Data</h3>
            <p class="text-slate-400 text-sm" id="error-message">Mungkin token API kadaluarsa atau URL-nya salah.</p>
        </div>

        <!-- Wadah List Komentar -->
        <div id="comments-list" class="hidden flex-col gap-4">
            <!-- Data API akan di-render ke sini oleh script.js -->
        </div>

    </main>

    <!-- Link ke file JavaScript terpisah -->
    <script src="script.js"></script>
</body>
</html>
